<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Currency Converter</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Currency Converter</h1>

        <label for="amount">Enter Amount</label>

        <input
            type="number"
            id="amount"
            value="100"
            min="0"
            placeholder="Enter amount"
        >

        <div class="currency-box">
            <div class="currency-section">

                <label>From</label>

                <div class="select-box">
                    <img id="fromFlag" src="https://flagsapi.com/US/flat/32.png">
                    <select id="fromCurrency"></select>
                </div>

            </div>
            <button id="swapBtn" class="swap-btn">⇄</button>
            <div class="currency-section">

                <label>To</label>

                <div class="select-box">
                    <img id="toFlag" src="https://flagsapi.com/IN/flat/32.png">
                    <select id="toCurrency"></select>
                </div>

            </div>

        </div>


        <button id="exchangeBtn">
            Get Exchange Rate
        </button>


        <div id="result">
            Enter amount and click Get Exchange Rate
        </div>

    </div>


    <script src="app.js"></script>

</body>
</html>
